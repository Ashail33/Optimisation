[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optim"
version = "0.1.0"
description = "A generalised metaheuristic optimisation library supporting Genetic Algorithms, PSO, Local Search, Simulated Annealing, DBMOSA, and Ensemble Optimisers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["optimisation", "metaheuristics", "genetic algorithm", "pso", "simulated annealing", "ensemble"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["optim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
