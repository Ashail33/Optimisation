[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optim"
version = "0.1.0"
description = "A generalised metaheuristic optimisation library supporting Genetic Algorithms, PSO, Local Search, Simulated Annealing, DBMOSA, and Ensemble Optimisers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["optimisation", "metaheuristics", "genetic algorithm", "pso", "simulated annealing", "ensemble"]
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["optim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
