[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optim"
version = "0.3.0"
description = "Metaheuristic optimisation library: 20 optimisers, 7 ensemble types, a problem suite with profit functions, and a benchmark harness with dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["optimisation", "metaheuristics", "genetic algorithm", "pso", "simulated annealing", "ensemble"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Benchmark harness (optim.bench): tables, YAML configs, statistics, resources.
bench = [
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "psutil>=5.9",
]

[project.scripts]
optbench = "optim.bench.cli:main"

[tool.setuptools.packages.find]
include = ["optim*"]

[tool.setuptools.package-data]
"optim.bench" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
